[project]
name = "udemy-mcp"
version = "0.1.0"
description = "Session-authenticated MCP server exposing Udemy Personal Plan & enrolled courses/curricula to local AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",   # the server uses FastMCP (mcp 1.x); mcp 2.x renamed it
    "curl_cffi>=0.7.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
]

[project.scripts]
udemy-mcp = "udemy_mcp.server:main"
udemy-mcp-auth = "udemy_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
